<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6.371 km left — line zoom with cut globe</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #f3f0e8;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    touch-action: none;
  }
  /* Tool size fields; zoom.js places them on the debug panel. */
  .tool-size {
    position: fixed;
    display: none;
    box-sizing: border-box;
    width: 62px;
    height: 18px;
    padding: 0 4px;
    border: 1px solid;
    border-radius: 2px;
    background: transparent;
    font: 12px ui-sans-serif, "Helvetica Neue", Helvetica, Arial, sans-serif;
    text-align: right;
  }
</style>
<script>
/* Apply a saved dark ground before the first paint. The colour is the
   invert of the paper, not a second palette. */
(function () {
  var dark = false;
  try { dark = localStorage.getItem("zoom-lines-theme") === "dark"; } catch (e) {}
  if (!dark) return;
  var v = (0xffffff ^ parseInt("f3f0e8", 16)).toString(16);
  while (v.length < 6) v = "0" + v;
  var s = document.createElement("style");
  s.textContent = "html,body{background:#" + v + "}";
  document.head.appendChild(s);
})();
</script>
</head>
<body>
<canvas id="sheet" aria-label="Line section from a 10 square metre patch out to a cut through the Earth"></canvas>
<input class="tool-size" id="toolW" type="number" min="0.01" max="10" step="0.01" aria-label="Tool width in metres">
<input class="tool-size" id="toolH" type="number" min="0.01" max="10" step="0.01" aria-label="Tool height in metres">
<script src="../dig/sim.js"></script>
<script src="../dig/paint.js"></script>
<script src="ground.js"></script>
<script src="zoom.js"></script>
</body>
</html>
