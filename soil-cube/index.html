<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soil cube look</title>
  <style>
    :root {
      --bg: #e6d7c8;
      --ink: #2b231d;
      --muted: #6d5c50;
      --soil: #241810;
      --size: 150px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse at 50% 0%, #f3e8dc 0%, var(--bg) 46%);
      color: var(--ink);
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
    }

    header {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 0.85rem 1.25rem 0.2rem;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    header p {
      margin: 0.15rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .ref-wrap {
      margin: 0 0 0 auto;
      text-align: center;
    }

    .ref {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 6px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6), 0 8px 18px rgba(60, 40, 28, 0.18);
      display: block;
    }

    .ref-wrap figcaption {
      margin-top: 0.2rem;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1.4rem;
      padding: 0.35rem 1.25rem 0.2rem;
    }

    .controls label {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.92rem;
    }

    .controls input[type="range"] {
      width: 148px;
      accent-color: var(--soil);
    }

    .controls output {
      min-width: 1.6rem;
      font-variant-numeric: tabular-nums;
    }

    .viewport {
      flex: 1;
      min-height: 0;
      position: relative;
      display: grid;
      place-items: center;
      perspective: 1200px;
      perspective-origin: 50% 40%;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .viewport:active { cursor: grabbing; }

    .viewport::after {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: 10%;
      height: 16%;
      background: radial-gradient(ellipse, rgba(70, 46, 32, 0.28), transparent 70%);
      pointer-events: none;
    }

    .rig, .grid, .cube {
      transform-style: preserve-3d;
    }

    .grid {
      position: relative;
      width: 0;
      height: 0;
    }

    .cube {
      position: absolute;
      width: var(--size);
      height: var(--size);
      margin-left: calc(var(--size) / -2);
      margin-top: calc(var(--size) / -2);
    }

    .face {
      position: absolute;
      inset: 0;
      background: var(--soil);
    }

    .face img {
      width: calc(100% + 2px);
      height: calc(100% + 2px);
      margin: -1px;
      display: block;
      backface-visibility: hidden;
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }

    .front  { transform: translateZ(calc(var(--size) / 2)); }
    .back   { transform: rotateY(180deg) translateZ(calc(var(--size) / 2)); }
    .right  { transform: rotateY(90deg) translateZ(calc(var(--size) / 2)); }
    .left   { transform: rotateY(-90deg) translateZ(calc(var(--size) / 2)); }
    .top    { transform: rotateX(90deg) translateZ(calc(var(--size) / 2)); }
    .bottom { transform: rotateX(-90deg) translateZ(calc(var(--size) / 2)); }

    /* The photo has no fourth side. A mirrored side cut fills the hidden face. */
    .right img { transform: scaleX(-1); }

    footer {
      padding: 0 1.25rem 0.7rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Soil cube</h1>
      <p>Mapped cubes, sitting next to each other. Rows run back.</p>
    </div>
    <figure class="ref-wrap">
      <img class="ref" src="reference.png" alt="Reference photo of one soil cube">
      <figcaption>Reference</figcaption>
    </figure>
  </header>

  <div class="controls">
    <label>Across
      <input id="cols" type="range" min="1" max="8" value="3" step="1">
      <output id="cols-out">3</output>
    </label>
    <label>Rows
      <input id="rows" type="range" min="1" max="6" value="2" step="1">
      <output id="rows-out">2</output>
    </label>
    <label>Spacing
      <input id="gap" type="range" min="0" max="160" value="36" step="1">
      <output id="gap-out">36</output>
    </label>
  </div>

  <main class="viewport">
    <div class="rig">
      <div class="grid"></div>
    </div>
  </main>

  <footer>Drag to orbit. Scroll to zoom. The far sides of each cube repeat a cut, because the photo only shows three faces.</footer>

  <script>
    // Faces were cut from reference.png. Quads, in photo pixels, before a
    // small inset so the backdrop stays out of the corners:
    //   top:        left-top, back, right-top, front-top
    //   front cut:  front-top, right-top, right-bottom, front-bottom
    //   side cut:   left-top, front-top, front-bottom, left-bottom

    (function () {
      var SIZE = 150;
      var grid = document.querySelector(".grid");
      var rig = document.querySelector(".rig");
      var colsInput = document.getElementById("cols");
      var rowsInput = document.getElementById("rows");
      var gapInput = document.getElementById("gap");
      var viewport = document.querySelector(".viewport");

      var state = { cols: 3, rows: 2, gap: 36, rx: -30, ry: -42, zoom: 1 };
      var dragging = false;
      var lastX = 0;
      var lastY = 0;

      function makeFace(className, src) {
        var face = document.createElement("div");
        var img = document.createElement("img");
        face.className = "face " + className;
        img.src = src;
        img.alt = "";
        face.appendChild(img);
        return face;
      }

      function makeCube() {
        var cube = document.createElement("div");
        cube.className = "cube";
        cube.appendChild(makeFace("front", "face-front.png"));
        cube.appendChild(makeFace("back", "face-front.png"));
        cube.appendChild(makeFace("right", "face-side.png"));
        cube.appendChild(makeFace("left", "face-side.png"));
        cube.appendChild(makeFace("top", "face-top.png"));
        cube.appendChild(makeFace("bottom", "face-bottom.png"));
        return cube;
      }

      function readControls() {
        state.cols = Number(colsInput.value);
        state.rows = Number(rowsInput.value);
        state.gap = Number(gapInput.value);
        document.getElementById("cols-out").textContent = String(state.cols);
        document.getElementById("rows-out").textContent = String(state.rows);
        document.getElementById("gap-out").textContent = String(state.gap);
      }

      function place() {
        var need = state.cols * state.rows;
        var step = SIZE + state.gap;
        var r, c, i, cube, x, z;
        while (grid.children.length > need) grid.removeChild(grid.lastChild);
        while (grid.children.length < need) grid.appendChild(makeCube());
        i = 0;
        for (r = 0; r < state.rows; r++) {
          for (c = 0; c < state.cols; c++) {
            cube = grid.children[i];
            x = (c - (state.cols - 1) / 2) * step;
            z = ((state.rows - 1) / 2 - r) * step;
            cube.style.transform = "translate3d(" + x + "px, 0px, " + z + "px)";
            i += 1;
          }
        }
      }

      function fitScale() {
        var step = SIZE + state.gap;
        var spanX = (state.cols - 1) * step + SIZE;
        var spanZ = (state.rows - 1) * step + SIZE;
        var span = Math.max(spanX, spanZ);
        return Math.min(1.35, 680 / span);
      }

      function applyView() {
        var scale = fitScale() * state.zoom;
        rig.style.transform =
          "rotateX(" + state.rx + "deg) rotateY(" + state.ry + "deg) scale(" + scale + ")";
      }

      function refresh() {
        readControls();
        place();
        applyView();
      }

      colsInput.addEventListener("input", refresh);
      rowsInput.addEventListener("input", refresh);
      gapInput.addEventListener("input", refresh);

      viewport.addEventListener("pointerdown", function (event) {
        dragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
        viewport.setPointerCapture(event.pointerId);
      });

      viewport.addEventListener("pointermove", function (event) {
        if (!dragging) return;
        state.ry += (event.clientX - lastX) * 0.45;
        state.rx += (event.clientY - lastY) * 0.35;
        if (state.rx > 89) state.rx = 89;
        if (state.rx < -89) state.rx = -89;
        lastX = event.clientX;
        lastY = event.clientY;
        applyView();
      });

      function endDrag() { dragging = false; }
      viewport.addEventListener("pointerup", endDrag);
      viewport.addEventListener("pointercancel", endDrag);

      viewport.addEventListener("wheel", function (event) {
        event.preventDefault();
        var next = state.zoom * (event.deltaY > 0 ? 0.92 : 1.08);
        if (next < 0.35) next = 0.35;
        if (next > 2.8) next = 2.8;
        state.zoom = next;
        applyView();
      }, { passive: false });

      refresh();
    }());
  </script>
</body>
</html>
